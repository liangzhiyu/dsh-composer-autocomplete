name: Test and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.9.0', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: |
          node -e "require('fs').mkdirSync('artifacts', { recursive: true })"
      - run: npm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}-node-${{ matrix.node }}
          path: artifacts/*.tgz
